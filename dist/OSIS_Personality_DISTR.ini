; OStim Standalone Immersive Sex (OSIS) optional personality hooks.
;
; OSIS gives every actor a personality by itself, the first time a scene needs one: from the voice type, the AI values, or a seeded roll
; weighted towards balanced, with few dominant. This file hands out nothing, so that mix stands. Earlier versions of this file gave every
; NPC one of four keywords (a quarter of them dominant), which overrode all of it.
;
; SPID creates these keywords at runtime and OSIS reads them if they are present. To take over for some actors, take the semicolon off the
; lines you want. The last number on a line is the chance, in percent; keep it small, and keep the dominant and crazed ones smallest: a
; dominant holds a partner's climax, and a crazed one drives its partner to it.
;
; Keywords OSIS reads: OSIS_Personality_Bashful or _Soft (shy), _Bold (vocal), _Fierce (dominant), _Timid, _Wild, _Crazed (or _Yandere)
; and _Submissive (LoversLab edition; the lite edition plays it as timid). Format:
;   Keyword = ID|StringFilters|FormFilters|LevelFilters|Traits|Count|Chance
; Traits "-C" skips children. The exclusive group keeps one keyword per NPC. Chances are rolled one entry after another, so an entry's real
; share is its chance times what the earlier ones left over.
;
; ExclusiveGroup = OSIS_Personality|OSIS_Personality_Bashful,OSIS_Personality_Bold,OSIS_Personality_Timid,OSIS_Personality_Wild,OSIS_Personality_Fierce
;
; Keyword = OSIS_Personality_Bashful|ActorTypeNPC|||-C||8
; Keyword = OSIS_Personality_Bold|ActorTypeNPC|||-C||8
; Keyword = OSIS_Personality_Timid|ActorTypeNPC|||-C||6
; Keyword = OSIS_Personality_Wild|ActorTypeNPC|||-C||4
; Keyword = OSIS_Personality_Fierce|ActorTypeNPC|||-C||2
