; OStim Expression Director (OSED) optional personality hooks.
; SPID creates these dynamic keywords at runtime. OSED reads them if present,
; but the mod works without SPID and falls back to deterministic actor seed.
;
; OSED Reborn fix: the original lines ended in "|||||18!", which put "18!" in
; SPID's Chance field (not a number), so distribution was undefined. Format is:
;   Keyword = ID|StringFilters|FormFilters|LevelFilters|Traits|Count|Chance
; Traits "-C" skips children. The exclusive group keeps one keyword per NPC; the
; rising chances (25/33/50/100) aim for a roughly even split if SPID applies the
; entries in file order.

ExclusiveGroup = OSED_Personality|OSED_Personality_Bashful,OSED_Personality_Bold,OSED_Personality_Soft,OSED_Personality_Fierce

Keyword = OSED_Personality_Bashful|ActorTypeNPC|||-C||25
Keyword = OSED_Personality_Bold|ActorTypeNPC|||-C||33
Keyword = OSED_Personality_Soft|ActorTypeNPC|||-C||50
Keyword = OSED_Personality_Fierce|ActorTypeNPC|||-C||100
